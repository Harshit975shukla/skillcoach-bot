# SkillCoach Helm values - sized for a single OCI Always Free A1 node
# (2 OCPU / 12 GB total). Keep replicas at 1 and resource requests small so
# the app, PostgreSQL, ArgoCD and the ingress controller all fit.

# -- Container image. GitHub Actions publishes an immutable commit-SHA tag to
#    GHCR; Argo CD reads the selected tag from values-oci.yaml.
image:
  # e.g. ghcr.io/harshit975shukla/skillcoach-bot
  repository: REPLACE_WITH_GHCR_REPO
  tag: "latest"
  pullPolicy: IfNotPresent

# -- GHCR pull secret for private images (created out-of-band; see README).
imagePullSecrets:
  - name: ghcr-pull-secret

# -- Kubernetes-enforced security for every pod that runs the app image.
#    appUid must match `useradd --uid` in deploy-oci/docker/Dockerfile.
security:
  appUid: 10001
  tmpSize: 256Mi

# -- Firewall rule: only app pods may reach PostgreSQL (needs an enforcing CNI such as Calico).
networkPolicy:
  enabled: true

# -- Flask web tier.
web:
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
  # gunicorn already defined in the image CMD; override here only if needed.
  probes:
    timeoutSeconds: 5
    # Up to 5 s x 24 = 2 minutes for the first start on a small ARM node.
    startupFailures: 24
    # Restart only after 15 s x 8 = 120 s without an answer, longer than
    # gunicorn's --timeout 90 for one slow request.
    livenessPeriodSeconds: 15
    livenessFailures: 8

# -- Ingress (the Traefik ingress controller must be installed in the cluster; it
#    redirects HTTP to HTTPS on its "web" entrypoint, set when Traefik is installed).
#    The app needs HTTPS: WEB_APP_URL must be https://, the sign-in cookies are
#    __Host- cookies (browsers send them only over HTTPS) and Telegram calls
#    only HTTPS webhooks.
ingress:
  enabled: true
  className: traefik
  # A DNS name that points at the load balancer IP. Without a domain, use sslip.io:
  # for the IP 141.148.10.20 the host is "141-148-10-20.sslip.io". Leave blank to
  # answer on the bare IP (HTTP only, for a first smoke test).
  host: ""
  tls:
    enabled: false
    # The Secret that holds the certificate; cert-manager creates and renews it.
    # Blank means "<release>-skillcoach-tls".
    secretName: ""
  # cert-manager (installed with the cluster add-ons) asks Let's Encrypt for a free
  # certificate through an HTTP-01 check on port 80, then renews it before expiry.
  certManager:
    enabled: true
    # Start with letsencrypt-staging (test certificates, generous rate limits);
    # switch to letsencrypt-prod once staging works.
    clusterIssuer: letsencrypt-staging
    # Also create both ClusterIssuers (needs the cert-manager CRDs in the cluster).
    createIssuers: false
    # Let's Encrypt sends expiry warnings here. Required when createIssuers is true.
    email: ""

# -- Scheduled CronJobs. Schedules are written in timeZone (India time), so
#    they read exactly like the product: 09:00 lesson, 18:00 quiz.
#    renderMedia=false adds the app's --no-media flag: the slim image has no
#    ffmpeg/Mermaid, so videos are left for the media worker.
cron:
  timeZone: "Asia/Kolkata"
  renderMedia: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi
  jobs:
    lesson:
      enabled: true
      schedule: "0 9 * * 1-5"    # Mon-Fri 09:00 IST
      args: ["schedule", "lesson"]
      media: true                # lesson text and its video go out together
    quiz:
      enabled: true
      schedule: "0 18 * * 1-5"   # Mon-Fri 18:00 IST
      args: ["schedule", "quiz"]
    weekly:
      enabled: true
      schedule: "0 9 * * 6"      # Sat 09:00 IST
      args: ["schedule", "weekly"]
    review:
      enabled: true
      schedule: "0 10 * * 0"     # Sun 10:00 IST
      args: ["schedule", "review"]
    recovery:
      enabled: true
      schedule: "*/5 * * * *"    # every 5 minutes
      args: ["recover"]
      media: true                # finishes any video still waiting

# -- Database migration Job (runs `python -m skillcoach.cli migrate`).
migration:
  enabled: true
  timeoutSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

# -- Media worker image (deploy-oci/docker/Dockerfile.media), used by CronJobs
#    with `media: true`. It shares image.tag with the app image.
media:
  repository: REPLACE_WITH_GHCR_MEDIA_REPO
  shmSize: 256Mi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

# -- Nightly backup to OCI Object Storage (time is in cron.timeZone).
#    Needs secrets.backupUploadUrl: a write-only bucket PAR URL ending in "/o/".
backup:
  enabled: true
  schedule: "30 2 * * *"   # 02:30 IST, far from the 09:00 and 18:00 slots
  uploaderImage: curlimages/curl:8.16.0
  scratchSize: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- In-cluster PostgreSQL (Option 1: hand-written StatefulSet + PVC).
#    NOT for production data; this is a learning data tier.
postgresql:
  enabled: true
  image: postgres:16-alpine
  # The alpine image's postgres user. Change to 999 for the Debian image.
  uid: 70
  database: skillcoach
  username: skillcoach
  # Password is supplied via the Secret (see secrets below), never hard-coded.
  port: 5432
  storage:
    # OCI block volume via the default oci-bv storage class.
    storageClassName: oci-bv
    size: 10Gi
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

# -- Non-secret application config (goes into a ConfigMap).
config:
  DELIVERY_CHANNEL: "telegram"
  MAX_LEARNERS: "10"
  ACCESS_REQUESTS_ENABLED: "false"
  DAILY_AI_OPERATIONS: "40"
  NARRATION_ENABLED: "false"
  LABS_ENABLED: "false"
  GROQ_MODEL: "openai/gpt-oss-120b,openai/gpt-oss-20b"
  SMTP_PORT: "587"
  # WEB_APP_URL defaults to https://<ingress.host> when ingress.tls.enabled is true.

# -- Secret values. LEAVE BLANK in Git. Supply at deploy time with
#    `helm upgrade --set-string secrets.telegramBotToken=...` or a sealed/
#    external secret. The chart renders a Secret with these keys regardless.
secrets:
  # Internal DB password for the in-cluster PostgreSQL + the app's DATABASE_URL.
  postgresPassword: ""
  telegramBotToken: ""
  telegramWebhookSecret: ""
  groqApiKey: ""
  cronSecret: ""
  ownerId: ""
  telegramBotUsername: ""
  # Optional (web/email/push); leave blank unless enabling those features.
  smtpHost: ""
  smtpUsername: ""
  smtpPassword: ""
  emailFrom: ""
  ownerEmail: ""
  webPushPublicKey: ""
  webPushPrivateKey: ""
  # Write-only Object Storage PAR URL for nightly backups (ends in "/o/").
  backupUploadUrl: ""
