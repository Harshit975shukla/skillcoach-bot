apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skillcoach.fullname" . }}-web
  labels:
    {{- include "skillcoach.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    # Starts after the migration Job (wave 0) has finished.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "skillcoach.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "skillcoach.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
        skillcoach.io/database-client: "true"
      annotations:
        # Roll the pods when secret/config change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "skillcoach.appPodSecurity" . | nindent 6 }}
      {{- include "skillcoach.tmpVolume" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "skillcoach.containerSecurity" . | nindent 10 }}
          {{- include "skillcoach.tmpMount" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: PORT
              value: {{ .Values.web.port | quote }}
            # Compose DATABASE_URL from the in-cluster Postgres + secret password.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillcoach.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: {{ include "skillcoach.databaseUrl" . | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "skillcoach.fullname" . }}-config
            - secretRef:
                name: {{ include "skillcoach.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # GET / returns {"service":"skillcoach","live":true} with no auth and no
          # database call. /health/ready needs the webhook secret in a header, which
          # would put the secret in plain text in this spec, so it is not used here.
          {{- with .Values.web.probes }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .startupFailures }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: 3
          # Slow AI calls can fill every gunicorn slot. Only restart a pod that has not
          # answered for longer than gunicorn's own request timeout.
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: {{ .livenessPeriodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .livenessFailures }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillcoach.fullname" . }}-web
  labels:
    {{- include "skillcoach.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "skillcoach.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
