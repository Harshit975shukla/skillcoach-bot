apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skillcoach.fullname" . }}-config
  labels:
    {{- include "skillcoach.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if and .Values.ingress.enabled .Values.ingress.tls.enabled (not (hasKey .Values.config "WEB_APP_URL")) }}
  WEB_APP_URL: {{ printf "https://%s" .Values.ingress.host | quote }}
  {{- end }}
