{{- if .Values.migration.enabled }}
# Builds or upgrades the database tables before the web app and CronJobs start.
# `skillcoach.cli migrate` is additive and safe to repeat.
#
# Order (Argo CD sync waves): database/config (-1) -> this Job (0) -> app (1).
# Plain Helm: runs after the first install and before every upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "skillcoach.fullname" . }}-migrate
  labels:
    {{- include "skillcoach.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.migration.timeoutSeconds }}
  template:
    metadata:
      labels:
        {{- include "skillcoach.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
        skillcoach.io/database-client: "true"
    spec:
      restartPolicy: Never
      {{- include "skillcoach.appPodSecurity" . | nindent 6 }}
      {{- include "skillcoach.tmpVolume" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Wait until PostgreSQL accepts connections, so a slow database start is not a failure.
        - name: wait-for-database
          image: {{ .Values.postgresql.image | quote }}
          {{- include "skillcoach.containerSecurity" . | nindent 10 }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "skillcoach.pg.fullname" . }} -p {{ .Values.postgresql.port }}; do sleep 2; done
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "skillcoach.containerSecurity" . | nindent 10 }}
          {{- include "skillcoach.tmpMount" . | nindent 10 }}
          command: ["python", "-m", "skillcoach.cli", "migrate"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillcoach.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: {{ include "skillcoach.databaseUrl" . | quote }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}
