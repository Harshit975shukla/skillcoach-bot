apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skillcoach.fullname" . }}-secrets
  labels:
    {{- include "skillcoach.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  # Internal PostgreSQL password (used by both the DB and the app).
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  # Core app secrets.
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | quote }}
  TELEGRAM_WEBHOOK_SECRET: {{ .Values.secrets.telegramWebhookSecret | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
  CRON_SECRET: {{ .Values.secrets.cronSecret | quote }}
  OWNER_ID: {{ .Values.secrets.ownerId | quote }}
  TELEGRAM_BOT_USERNAME: {{ .Values.secrets.telegramBotUsername | quote }}
  # Optional web/email/push secrets (blank unless those features are enabled).
  SMTP_HOST: {{ .Values.secrets.smtpHost | quote }}
  SMTP_USERNAME: {{ .Values.secrets.smtpUsername | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  EMAIL_FROM: {{ .Values.secrets.emailFrom | quote }}
  OWNER_EMAIL: {{ .Values.secrets.ownerEmail | quote }}
  WEB_PUSH_PUBLIC_KEY: {{ .Values.secrets.webPushPublicKey | quote }}
  WEB_PUSH_PRIVATE_KEY: {{ .Values.secrets.webPushPrivateKey | quote }}
{{- if and .Values.postgresql.enabled .Values.backup.enabled }}
---
# Separate Secret so the app pods (which load every key of the main Secret)
# never receive the backup upload link. Only the backup CronJob reads it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skillcoach.fullname" . }}-backup
  labels:
    {{- include "skillcoach.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  # Write-only Object Storage PAR URL ending in "/o/".
  BACKUP_UPLOAD_URL: {{ .Values.secrets.backupUploadUrl | quote }}
{{- end }}
