name: SkillCoach labs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillcoach-labs-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lab-s3-private-presigned:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: hashFiles('.skillcoach/s3-private-presigned.token') == ''
        run: echo "No .skillcoach/s3-private-presigned.token file, so this lab is not being attempted."
      - if: hashFiles('.skillcoach/s3-private-presigned.token') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: hashFiles('.skillcoach/s3-private-presigned.token') != ''
        run: python -m pip install -r requirements-lab.txt
      - if: hashFiles('.skillcoach/s3-private-presigned.token') != ''
        run: |
          rm -f .skillcoach-report.xml
          python -I -m pytest -c pytest.ini --noconftest --junitxml=.skillcoach-report.xml labs/s3-private-presigned
          python -I .github/check_report.py .skillcoach-report.xml 12
