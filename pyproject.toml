[project]
name = "skillcoach-bot"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.1.2",
    "requests==2.32.5",
    "psycopg[binary]==3.2.10",
    "pydantic==2.12.3",
    "tzdata==2025.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "ruff==0.13.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skillcoach"]
py-modules = ["lesson_content"]

[tool.setuptools.package-data]
skillcoach = ["migrations/*.sql", "certs/*.crt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.vercel]
entrypoint = "api.webhook:app"
