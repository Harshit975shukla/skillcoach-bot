[project]
name = "skillcoach-bot"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.1.2",
    "requests==2.32.5",
    # read1(decode_content=False) in lab checks requires urllib3 2.x.
    "urllib3==2.8.0",
    "psycopg[binary]==3.2.10",
    "pydantic==2.12.3",
    "tzdata==2025.2",
    "Pillow==11.3.0",
    "pypdf==6.19.0",
    # Web push: RFC 8291 message encryption (http-ece) and RFC 8292 VAPID signing (py-vapid).
    "cryptography==50.0.2",
    "http-ece==1.2.1",
    "py-vapid==1.9.4",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "ruff==0.13.2"]
labs = ["boto3==1.43.103", "moto[s3,dynamodb,sqs]==5.2.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skillcoach"]
py-modules = ["lesson_content"]

[tool.setuptools.package-data]
skillcoach = ["migrations/*.sql", "certs/*.crt", "static/*", "course_data/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.vercel]
entrypoint = "api.webhook:app"
