name: Publish OCI learning images

on:
  push:
    branches:
      - oci-learning
    paths:
      - "deploy-oci/**"
      - "tests/test_helm_chart.py"
      - "tests/test_container_image.py"
      - "tests/test_oci_gitops.py"
      - ".github/workflows/publish-oci-images.yml"
  pull_request:
    paths:
      - "deploy-oci/**"
      - "tests/test_helm_chart.py"
      - "tests/test_container_image.py"
      - "tests/test_oci_gitops.py"
      - ".github/workflows/publish-oci-images.yml"
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Upload both ARM64 images to GHCR and update the Git tag; this does not deploy to OCI"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: oci-learning-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate chart and container definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'oci-learning' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pip install -r requirements.txt
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Run chart and image tests
        run: |
          python -m pytest -q tests/test_helm_chart.py tests/test_container_image.py tests/test_oci_gitops.py
          python -m ruff check tests/test_helm_chart.py tests/test_container_image.py tests/test_oci_gitops.py
          helm lint deploy-oci/helm/skillcoach
          helm template skillcoach deploy-oci/helm/skillcoach \
            -f deploy-oci/helm/skillcoach/values-oci.yaml \
            --set image.tag=validation-only

  publish:
    name: Build and publish immutable ARM64 images
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_images == 'yes' &&
      github.ref == 'refs/heads/oci-learning'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm this is still the branch head
        run: |
          test "$GITHUB_REF" = "refs/heads/oci-learning"
          branch_sha="$(git ls-remote origin refs/heads/oci-learning | cut -f1)"
          test "$branch_sha" = "$GITHUB_SHA" || {
            echo "::error::The oci-learning branch moved after this workflow was started."
            exit 1
          }
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing commit-SHA tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          owner = "harshit975shukla"
          tag = os.environ["IMAGE_TAG"]
          token = os.environ["GH_TOKEN"]
          packages = ("skillcoach-bot", "skillcoach-bot-media")

          for package in packages:
              url = (
                  "https://api.github.com/users/"
                  + urllib.parse.quote(owner, safe="")
                  + "/packages/container/"
                  + urllib.parse.quote(package, safe="")
                  + "/versions?per_page=100"
              )
              while url:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          versions = json.load(response)
                          link = response.headers.get("Link", "")
                  except urllib.error.HTTPError as error:
                      if error.code == 404 and "page=1" not in url:
                          break
                      if error.code == 404:
                          # No package exists yet; the registry login and package-write
                          # permission were already verified by the preceding step.
                          break
                      raise

                  for version in versions:
                      tags = version.get("metadata", {}).get("container", {}).get("tags", [])
                      if tag in tags:
                          sys.exit(f"Refusing to overwrite existing {package}:{tag}")

                  url = None
                  for part in link.split(","):
                      if 'rel="next"' in part:
                          url = part[part.index("<") + 1 : part.index(">")]
                          break

          print("Neither package contains this commit SHA; publishing is safe.")
          PY
      - name: Publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy-oci/docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/harshit975shukla/skillcoach-bot:${{ github.sha }}
      - name: Publish media image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy-oci/docker/Dockerfile.media
          platforms: linux/arm64
          push: true
          tags: ghcr.io/harshit975shukla/skillcoach-bot-media:${{ github.sha }}
      - name: Update the Argo CD desired image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("deploy-oci/helm/skillcoach/values-oci.yaml")
          text = path.read_text(encoding="utf-8")
          marker = '  tag: "set-by-publish-workflow"'
          if text.count(marker) != 1:
              raise SystemExit("Expected exactly one image tag marker in values-oci.yaml")
          path.write_text(text.replace(marker, f'  tag: "{os.environ["IMAGE_TAG"]}"'), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-oci/helm/skillcoach/values-oci.yaml
          git commit -m "Select OCI learning images for $IMAGE_TAG"
          git push origin HEAD:oci-learning
      - name: Show immutable image references
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Web:    ghcr.io/harshit975shukla/skillcoach-bot:${IMAGE_TAG}"
          echo "Media:  ghcr.io/harshit975shukla/skillcoach-bot-media:${IMAGE_TAG}"
