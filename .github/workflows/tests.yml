name: Offline regression and disposable PostgreSQL integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillcoach_test
          POSTGRES_USER: skillcoach_test
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillcoach_test -d skillcoach_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://skillcoach_test:local-test-only@localhost:5432/skillcoach_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[test]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: npm ci
      - run: npm run test:diagrams
      - run: npm run test:dashboard
      - name: Render authored diagrams and check animated media locally
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python tests/verify_media.py
      - name: Verify caption-only explanatory video has no audio stream
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python tests/verify_storytelling.py
  prepare-fresh-database:
    needs: test
    if: github.event_name == 'push' && vars.SKILLCOACH_BOOTSTRAP_SHA == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Prepare explicitly authorized empty private database
        env:
          DATABASE_URL: ${{ secrets.SKILLCOACH_BOOTSTRAP_DATABASE_URL }}
          DATABASE_CA_CERT_FILE: ${{ vars.DATABASE_CA_CERT_FILE }}
          SKILLCOACH_RUNTIME_PASSWORD: ${{ secrets.SKILLCOACH_RUNTIME_PASSWORD }}
        run: python -m skillcoach.cli bootstrap-fresh
  upgrade-existing-database:
    needs: test
    if: github.event_name == 'workflow_dispatch' && vars.SKILLCOACH_UPGRADE_SHA == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Apply explicitly authorized additive upgrade with writers stopped
        env:
          DATABASE_URL: ${{ secrets.SKILLCOACH_UPGRADE_DATABASE_URL }}
          DATABASE_CA_CERT_FILE: ${{ vars.DATABASE_CA_CERT_FILE }}
        run: python -m skillcoach.cli upgrade-schema --writers-stopped
      - name: Verify the restricted production role can read the upgraded schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT_FILE: ${{ vars.DATABASE_CA_CERT_FILE }}
        run: python -m skillcoach.cli status
