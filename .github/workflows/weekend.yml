name: Weekend assessment and review
on:
  schedule:
    - cron: "30 3 * * 6"  # Saturday 09:00 IST
    - cron: "30 4 * * 0"  # Sunday 10:00 IST
  workflow_dispatch:
    inputs:
      kind:
        description: "Explicit operation (never inferred from runner weekday)"
        required: true
        type: choice
        options: [weekly, review]
      date:
        description: "Intended IST date YYYY-MM-DD (blank uses run creation date)"
        required: false
jobs:
  assessment:
    if: github.event.schedule == '30 3 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.kind == 'weekly')
    uses: ./.github/workflows/coach-job.yml
    with:
      kind: weekly
      intended_date: ${{ inputs.date || '' }}
    secrets: inherit
  review:
    if: github.event.schedule == '30 4 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.kind == 'review')
    uses: ./.github/workflows/coach-job.yml
    with:
      kind: review
      intended_date: ${{ inputs.date || '' }}
    secrets: inherit
