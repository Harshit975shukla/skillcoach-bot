name: Weekend (Sat Test + Sun Plan)

on:
  schedule:
    - cron: "30 3 * * 6"   # Saturday 9:00 AM IST = 03:30 UTC
    - cron: "30 4 * * 0"   # Sunday  10:00 AM IST = 04:30 UTC
  workflow_dispatch:
    inputs:
      day:
        description: "Which script to run"
        required: true
        default: "saturday"
        type: choice
        options:
          - saturday
          - sunday

jobs:
  weekend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run weekend script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          DAY=$(date -u +%A)
          INPUT="${{ github.event.inputs.day }}"
          if [ "$INPUT" = "sunday" ] || [ "$DAY" = "Sunday" ]; then
            python sunday_plan.py
          else
            python weekend_test.py
          fi
