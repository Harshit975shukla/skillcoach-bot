name: Shared private coaching worker
on:
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      intended_date:
        required: false
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: skillcoach-private-worker-${{ inputs.kind }}
  cancel-in-progress: false
jobs:
  coach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared Python runtime
        run: python -m pip install -r requirements.txt
      - name: Check for ready media work
        id: media
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPERATION: ${{ inputs.kind }}
        run: |
          if [ "$OPERATION" = "lesson" ] || python -m skillcoach.cli needs-media; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            RESULT=$?
            if [ "$RESULT" != "3" ]; then exit "$RESULT"; fi
          fi
      - uses: actions/setup-node@v4
        if: steps.media.outputs.needed == 'true'
        with:
          node-version: "22"
      - name: Install local renderers only when needed
        if: steps.media.outputs.needed == 'true'
        run: |
          npm ci
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Capture intended run timestamp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          echo "RUN_CREATED_AT=$CREATED" >> "$GITHUB_ENV"
      - name: Execute explicit operation and recover pending work
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID || secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DASHBOARD_REPO: ${{ vars.DASHBOARD_REPO }}
          DASHBOARD_PATH: ${{ vars.DASHBOARD_PATH || 'docs/data.json' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          OPERATION: ${{ inputs.kind }}
          INTENDED_DATE: ${{ inputs.intended_date }}
          MEDIA_READY: ${{ steps.media.outputs.needed }}
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          MEDIA_ARGS=()
          if [ "$MEDIA_READY" != "true" ]; then MEDIA_ARGS+=(--no-media); fi
          if [ "$OPERATION" = "recover" ]; then
            python -m skillcoach.cli recover "${MEDIA_ARGS[@]}"
          elif [ -n "$INTENDED_DATE" ]; then
            python -m skillcoach.cli schedule "$OPERATION" --date "$INTENDED_DATE" "${MEDIA_ARGS[@]}"
          else
            python -m skillcoach.cli schedule "$OPERATION" --at "$RUN_CREATED_AT" "${MEDIA_ARGS[@]}"
          fi
