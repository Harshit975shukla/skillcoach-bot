name: Morning lesson (09:00 IST weekdays)
permissions:
  contents: read
  actions: read
on:
  schedule:
    - cron: "30 3 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Intended IST date YYYY-MM-DD (blank uses run creation date)"
        required: false
jobs:
  lesson:
    uses: ./.github/workflows/coach-job.yml
    with:
      kind: lesson
      intended_date: ${{ inputs.date || '' }}
    secrets: inherit
